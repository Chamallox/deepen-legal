<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Readloop</title>
<style>
  :root {
    --surface: #FAF5EC; --card: #FFFDF7; --ink: #2B2620;
    --subtle: #7D7466; --accent: #B4502A; --hairline: #E6DECD;
    color-scheme: light;
  }
  body {
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 40rem; margin: 0 auto; padding: 3.5rem 1.25rem 6rem;
    color: var(--ink); background: var(--surface);
    -webkit-text-size-adjust: 100%;
  }
  h1, h2, h3 {
    font-family: ui-serif, "New York", Georgia, "Times New Roman", serif;
    font-weight: 600; color: var(--ink); letter-spacing: -0.01em;
  }
  h1 { font-size: 2rem; margin: 0 0 0.4rem; }
  h2 { font-size: 1.35rem; margin: 2.8rem 0 0.6rem; }
  h3 { font-size: 1.08rem; margin: 2rem 0 0.5rem; }
  /* A short centred rule under the title, the ornament `EditorialRule` draws in the app. */
  h1 + p { color: var(--subtle); font-size: 0.95rem; margin: 0 0 2.5rem;
    padding-bottom: 2rem; border-bottom: 1px solid var(--hairline); }
  p { margin: 0.9rem 0; }
  strong { font-weight: 600; }
  a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
  /* Cards are a brighter sheet framed by a hairline, never a drop shadow: see `CardModifier`. */
  table {
    border-collapse: collapse; width: 100%; margin: 1.4rem 0; font-size: 0.94rem;
    background: var(--card); border: 1px solid var(--hairline); border-radius: 8px;
    overflow: hidden;
  }
  th, td { border-bottom: 1px solid var(--hairline); padding: 0.6rem 0.7rem;
    text-align: left; vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  th { font-weight: 600; font-size: 0.82rem; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--subtle); }
  ul { padding-left: 1.15rem; }
  li { margin: 0.4rem 0; }
  li::marker { color: var(--accent); }
</style>
</head>
<body>
<h1>Readloop</h1>
<p>Legal documents for the Readloop app.</p>
<ul>
<li><a href="privacy">Privacy Policy</a></li>
<li><a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/">Terms of Use</a></li>
</ul>
<p>Questions: <a href="mailto:francois@nomi.so">francois@nomi.so</a></p>
</body>
</html>
